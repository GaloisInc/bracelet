name: doc

on:
  push:
  pull_request:
    # Don't run on code-only changes
    paths-ignore:
    - '**.c'
    - '**.cpp'
    - '**.h'
    - '**.py'
  workflow_dispatch:

concurrency:
  group: "doc-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    name: docs
    # The default is 360 (i.e., 6 hours), which can be wasteful. See:
    # https://github.com/Cambridge-ICCS/green-ci/blob/b9e942d81e4d6536d69f3cfbffe28fa14b8ae381/README.md#time-limits
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # https://github.com/actions/checkout/issues/485
        persist-credentials: false
        submodules: false

    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
      with:
        mdbook-version: '0.5.4'

    # TODO: Download binary
    - name: Install mdbook-mermaid
      run: cargo install mdbook-mermaid@0.17.1

    - name: Build docs
      working-directory: doc
      run: mdbook build

    - name: Upload docs artifact to GitHub Pages
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      if: github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository_owner == 'GaloisInc'
      with:
        path: doc/book/

  deploy:
    name: deploy
    needs: docs
    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository_owner == 'GaloisInc'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy docs to GitHub Pages
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      id: deployment
